name: Release

# A release is not idempotent: once a crate name plus version is out it can never be
# reused, and a yanked version cannot be un-yanked. So this workflow is written to
# refuse rather than to guess, and it can be rerun safely after a failure — because
# "this version is already in the registry" counts as done, not as an error.
#
# The checks live in ci.yaml and are called from here. Keeping them in the same run
# is what makes the ordering structural.

on:
  push:
    # The only trigger: a `v<major>.<minor>.<patch>` tag.
    # Nothing else can start a run, so nothing else can reach the registry, and what a
    # release tag looks like is enforced here rather than by a script remembering to
    # check it.
    tags: [ "v*.*.*" ]

# Read-only by default; the publish job does not ask for more either.
permissions:
  contents: read

jobs:
  # Every check that needs no credentials: formatting, clippy, tests on all three
  # platforms, rustdoc, `cargo package`, no async runtime, and the MSRV build.
  #
  # Calling the whole file means publish waits for every job inside it (the matrix
  # included), without listing them again here — a list would eventually miss one.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  # ---------------------------------------------------------------------------
  # crates.io.
  #
  # This is a single-crate repository (`[workspace]` holds only this crate), so there
  # is no in-workspace dependency order to respect and no "wait for the dependency to
  # reach the index" problem — all its dependencies are already sitting on crates.io.
  # The plan harbor computes is therefore one line, and it validates the tag and the
  # token along the way.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [ checks ]
    runs-on: ubuntu-latest
    # No `if:` needed: a tag push is the only entry point, so reaching this job means
    # a release is really wanted, and `needs` guarantees the checks have all passed.
    #
    # `environment:` is deliberately not declared either. Declaring it moves secrets
    # into an environment scope and requires that environment to exist before the
    # first run — not worth it for a gate that is not needed yet.
    # The token is read from Settings → Secrets and variables → Actions.
    # To add manual approval later, create the environment, add
    # `environment: <name>` back, and move the secret into it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # This job deliberately does not use `rust-cache`: it has no dependencies to
      # cache (the package is ready to go) and `cargo publish` verifies in seconds;
      # restoring the test job's cache is exactly what once led this job to clean up a
      # `target/package/` tree it had never created.

      # The release tool. What this job used to compute in shell — tag validation,
      # token validation, the publish loop — is now one harbor command.
      - name: Install the release tool
        run: cargo install harbor --locked

      # Two gates plus a plan in one command: the tag name matches the version in the
      # manifest, the registry token exists and is non-empty, and the publish plan can
      # be computed. Nothing is uploaded until all three hold.
      #
      # The token travels only through an environment variable, never as a command
      # line argument, so it cannot reach the logs by cargo echoing the command line.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor check --plan "$GITHUB_REF_NAME"

      # harbor publish will: retry while a dependency has not reached the index yet;
      # treat "the version is already in the registry" as done (so a rerun can finish
      # a half-failed release); and stop immediately on any other error rather than
      # spending the retry budget on a failure that retrying cannot fix.
      #
      # No `--order`: this is a single-package workspace, and the plan `check --plan`
      # just computed is the whole answer.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor publish
