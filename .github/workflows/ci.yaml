name: Checks

# The checks a release has to pass first. This file has no trigger of its own: the
# only way to run it is to call it from release.yaml.
#
# This is what makes "no release without passing checks" a structural guarantee
# rather than a matter of timing. `workflow_run` can also make two workflows wait for
# each other, but it runs in a second run, uses the file from the default branch, and
# the tag has to be passed by hand. As a reusable workflow, this is just a `needs:`
# within the same run.
on:
  workflow_call:

# Read-only: nothing here needs to write anything back.
permissions:
  contents: read

# Declared again here: a workflow's own `env` is not passed to a workflow it calls.
env:
  CARGO_TERM_COLOR: always
  # Make any build script or rustc invocation fail outright on a warning we care about.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    # This crate works directly with dynamic libraries: `dlopen`/`dlsym`, platform
    # specific file name derivation (Windows `x.dll`, macOS `libx.dylib`, Linux
    # `libx.so`), and an e2e test that really compiles and loads a cdylib. So all
    # three platforms run, not just one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # This repository deliberately has no `rust-toolchain.toml`: a pinned channel
      # would override the `cargo +<msrv>` in the msrv job below, while the
      # `rust-version` in `Cargo.toml` is the promise made to users that the msrv job
      # fulfills.
      - name: Install stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the integration test: it really runs `cargo build` on a fixture
      # cdylib, copies it into a temporary plugin store, then `dlopen`s it and calls a
      # function pointer across the boundary.
      - name: Test
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      # `cargo package` unpacks and rebuilds under `<target>/package/` to verify the
      # crate. Give this step a target directory of its own: it keeps the cache action
      # from running into that tree during its cleanup, and keeps this verification
      # build out of the cache, which has no use for it.
      - name: Package
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target
        run: cargo package --locked

      # "No async runtime anywhere in the stack" is a promise written down in the
      # README. Without this check it is only a sentence — a dependency could pull
      # tokio in and nobody would notice.
      - name: No async runtime in the dependency tree
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          names=$(cargo tree --prefix none 2>/dev/null | awk '{print $1}' | sort -u)
          offenders=$(printf '%s\n' "$names" \
            | grep -xE 'tokio|async-std|smol|async-io|async-executor|async-global-executor' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::this crate promises zero async runtime, but the dependency tree contains:"
            echo "$offenders"
            exit 1
          fi
          echo "no async runtime in the dependency tree"

  # ---------------------------------------------------------------------------
  # MSRV. `rust-version = "1.88"` is a promise; without this job it is just a line in
  # the manifest.
  #
  # 1.88 is not an arbitrary pick: it is the highest `rust-version` among the
  # dependencies (`libloading` 0.9 needs 1.88, `toml` / `ureq` need 1.85). Cargo
  # checks the toolchain against the highest value, so this job verifies that number.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from the manifest
        id: msrv
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - name: Install MSRV toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"

      # --locked: CI should resolve the committed lockfile, not whatever happens to
      # resolve today. `cargo build` rather than `cargo test`: the integration test
      # would start another `cargo build` for the fixture, and running the whole test
      # suite on the MSRV is a different matter; this job only proves it compiles.
      - name: Build on MSRV
        run: cargo build --all-targets --locked
