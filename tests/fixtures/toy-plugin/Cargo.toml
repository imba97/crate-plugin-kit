[package]
name = "toyapp-plugin-toy"
version = "0.1.0"
edition = "2021"
publish = false

# Single-element workspace. It gets copied to a temporary directory before being
# compiled, but it also lives under the main crate's tests/, so carrying this table is
# safer — if someone ever compiles it in place, no [workspace] above can claim it.
[workspace]

# The name must match what KitConfig::lib_stem("toyapp-plugin-toy") derives:
#   id = "toyapp" → lib_stem_prefix = "toyapp_plugin_"
#   crate_prefix   = "toyapp-plugin-" → stripping the prefix leaves "toy"
#   ⇒ toyapp_plugin_toy
[lib]
name = "toyapp_plugin_toy"
crate-type = ["cdylib"]

# Deliberately zero dependencies — so the test can compile it fully offline.
[dependencies]
