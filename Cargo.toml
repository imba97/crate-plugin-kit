[package]
name = "crate-plugin-kit"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Installs and loads cdylib plugins and builds their prebuilt assets."
license = "MIT"
authors = ["imba97 <mail@imba97.cn>"]
repository = "https://github.com/imba97/crate-plugin-kit"
homepage = "https://github.com/imba97/crate-plugin-kit"
documentation = "https://docs.rs/crate-plugin-kit"
keywords = ["plugin", "cdylib", "dlopen", "cargo", "extension"]
categories = ["development-tools", "filesystem"]
readme = "README.md"

# Things that are not packaged into the .crate.
# Only purely local files are excluded.
exclude = ["/.github", "/.scratch"]

# Producing the release assets. A bin in the same crate rather than a crate of its own:
# it is a thin shell over `pack_plugin`, and every decision it makes (the wrapper's
# contents, the lib name, the asset names) belongs to the library.
[[bin]]
name = "plugin-asset"
path = "src/bin/plugin-asset/main.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
ureq = "3.4.2"
which = "8.0.6"

[dev-dependencies]
tempfile = "3"

# `cargo binstall crate-plugin-kit` unpacks the archive from the release and would otherwise
# look for the binary inside a directory named after the crate. Ours are flat -- `plugin-asset`
# sits at the archive root next to `LICENSE` -- so the path inside the archive is the only
# thing that has to be spelled out. `{ bin }` is what keeps this right even though the
# binary's name (`plugin-asset`) differs from the crate's.
#
# Everything else stays at binstall's defaults on purpose: the archive is named after the
# crate (`crate-plugin-kit-<target>`, one of the filenames it tries), and `.tar.gz` is one of
# the extensions it accepts for its `tgz` format.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"

