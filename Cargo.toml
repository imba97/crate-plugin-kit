[package]
name = "crate-plugin-kit"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "A cargo-based plugin system: install cdylib plugins from crates.io and load them at runtime."
license = "MIT"
authors = ["imba97 <mail@imba97.cn>"]
repository = "https://github.com/imba97/crate-plugin-kit"
homepage = "https://github.com/imba97/crate-plugin-kit"
documentation = "https://docs.rs/crate-plugin-kit"
keywords = ["plugin", "cdylib", "dlopen", "cargo", "extension"]
categories = ["development-tools", "filesystem"]
readme = "README.md"

# Things that are not packaged into the .crate.
# Only purely local files are excluded.
exclude = ["/.github", "/.scratch"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
ureq = "3.4.2"
which = "8.0.6"

[dev-dependencies]
tempfile = "3"
